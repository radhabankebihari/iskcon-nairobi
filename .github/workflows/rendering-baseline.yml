name: Rendering baseline (manual)

on:
  workflow_dispatch:

jobs:
  record-linux-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:screens:update
        env:
          ANALYTICS_DISABLED: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendering-baseline-linux
          path: tests/e2e/screens-baseline.json
          retention-days: 14
